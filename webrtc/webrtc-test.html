<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vcp-media-server WebRTC Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1120px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    fieldset { margin-bottom: 1rem; box-sizing: border-box; }
    label { display: block; margin: 0.4rem 0 0.2rem; }
    input[type=text], select { width: 100%; box-sizing: border-box; padding: 0.4rem; }
    button { margin: 0.3rem 0.3rem 0.3rem 0; padding: 0.4rem 0.8rem; }
    video { width: 100%; height: 100%; background: #111; object-fit: contain; display: block; }
    #log { background: #f4f4f4; padding: 0.5rem; height: 160px; overflow: auto; font-size: 0.85rem; white-space: pre-wrap; }
    .row { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 1rem; align-items: stretch; }
    .col { min-width: 0; }
    .media-panel { height: 100%; display: flex; flex-direction: column; }
    .panel-controls { min-height: 76px; display: grid; grid-template-columns: repeat(2, minmax(130px, 1fr)) auto auto; gap: 0.5rem; align-items: end; }
    .panel-controls label { margin-top: 0; }
    .control-field { min-width: 0; }
    .video-box { margin-top: 0.5rem; aspect-ratio: 4 / 3; width: 100%; background: #111; }
    @media (max-width: 760px) {
      .row { grid-template-columns: 1fr; }
      .panel-controls { grid-template-columns: 1fr; min-height: 0; }
      button { width: 100%; margin-right: 0; }
    }
  </style>
</head>
<body>
  <h1>vcp-media-server WebRTC 测试</h1>
  <p><strong>测试方式：</strong>可双页（A 推流、B 播放），也可<strong>同页</strong>先推流再播放。多页播放同一 <code>stream_id</code> 互不影响。播放时服务器会向推流端请求关键帧。</p>

  <fieldset>
    <legend>连接</legend>
    <label>信令地址</label>
    <input id="wsUrl" type="text" value="ws://127.0.0.1:9080/">
    <label>流 ID (stream_id)</label>
    <input id="streamId" type="text" value="webrtc_test">
    <button id="btnConnect">连接信令</button>
    <button id="btnDisconnect" disabled>断开</button>
  </fieldset>

  <div class="row">
    <div class="col">
      <fieldset class="media-panel">
        <legend>推流 (Publish)</legend>
        <div class="panel-controls">
            <div class="control-field">
              <label for="publishSource">推流源</label>
              <select id="publishSource">
                <option value="camera">摄像头</option>
                <option value="testsrc">测试信号</option>
              </select>
            </div>
          <div class="control-field">
            <label for="publishCodec">推流编码</label>
            <select id="publishCodec">
              <option value="h264">H264</option>
              <option value="h265">H265 / HEVC</option>
            </select>
          </div>
          <button id="btnPublish" disabled>开始推流</button>
          <button id="btnStopPublish" disabled>停止推流</button>
        </div>
        <div class="video-box">
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
      </fieldset>
    </div>
    <div class="col">
      <fieldset class="media-panel">
        <legend>播放 (Play)</legend>
        <div class="panel-controls">
          <div class="control-field">
            <label>播放源</label>
            <input type="text" value="同一 stream_id" disabled>
          </div>
            <div class="control-field">
              <label>播放模式</label>
              <input type="text" value="实时播放" disabled>
            </div>
          <button id="btnPlay" disabled>开始播放</button>
          <button id="btnStopPlay" disabled>停止播放</button>
        </div>
        <div class="video-box">
          <video id="remoteVideo" autoplay muted playsinline controls></video>
        </div>
      </fieldset>
    </div>
  </div>

  <fieldset>
    <legend>日志</legend>
    <div id="log"></div>
  </fieldset>

  <script>
    const $ = (id) => document.getElementById(id);
    const logEl = $('log');
    function log(msg) {
      const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      console.log(line);
    }

    let ws = null;
    let publishPc = null;
    let playPc = null;
    let localStream = null;
    let activePc = null; // deprecated: use negotiatingPc for answers
    let negotiatingPc = null; // PC currently waiting for SDP answer
    let keyframeTimer = null;
    let keyframeMethod = null; // 'generateKeyFrame' | 'setParameters' | 'replaceTrack' | null | 'none'
    let publishVideoSenderRef = null;
    let publishVideoTrackRef = null;
    let keyframeRequestChain = Promise.resolve();
    let playGeneration = 0;
      let testSignalCanvas = null;
      let testSignalAnimationId = null;

      function stopTestSignal() {
        if (testSignalAnimationId) {
          cancelAnimationFrame(testSignalAnimationId);
          testSignalAnimationId = null;
        }
        testSignalCanvas = null;
      }

      function pad2(v) {
        return String(v).padStart(2, '0');
      }

      function formatElapsed(ms) {
        const total = Math.floor(ms / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
      }

      function drawTestSignal(ctx, width, height, startedAt, frame) {
        const elapsed = performance.now() - startedAt;
        const colors = ['#ffffff', '#ffff00', '#00ffff', '#00ff00', '#ff00ff', '#ff0000', '#0000ff', '#111111'];
        const barWidth = width / colors.length;

        ctx.fillStyle = '#101010';
        ctx.fillRect(0, 0, width, height);
        for (let i = 0; i < colors.length; i += 1) {
          ctx.fillStyle = colors[i];
          ctx.fillRect(i * barWidth, 0, Math.ceil(barWidth), Math.floor(height * 0.62));
        }

        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y <= height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        const lowerTop = Math.floor(height * 0.62);
        const graySteps = 8;
        for (let i = 0; i < graySteps; i += 1) {
          const v = Math.floor((255 * i) / (graySteps - 1));
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect(i * (width / graySteps), lowerTop, Math.ceil(width / graySteps), height - lowerTop);
        }

        const boxW = Math.floor(width * 0.72);
        const boxH = Math.floor(height * 0.32);
        const boxX = Math.floor((width - boxW) / 2);
        const boxY = Math.floor(height * 0.34);
        ctx.fillStyle = 'rgba(0,0,0,0.72)';
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 34px system-ui, sans-serif';
        ctx.fillText('VCP MEDIA SERVER TEST', width / 2, boxY + 46);
        ctx.font = 'bold 58px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillText(formatElapsed(elapsed), width / 2, boxY + 118);

        const now = new Date();
        ctx.font = '24px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillStyle = '#00ff90';
        ctx.fillText(
          `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}  frame=${frame}`,
          width / 2,
          boxY + 158
        );

        const sweepX = Math.floor((elapsed / 20) % width);
        ctx.strokeStyle = '#ff2d2d';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(sweepX, 0);
        ctx.lineTo(sweepX, height);
        ctx.stroke();
      }

      function createTestSignalStream() {
        const width = 640;
        const height = 480;
        const fps = 25;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        if (!ctx || typeof canvas.captureStream !== 'function') {
          throw new Error('当前浏览器不支持 Canvas captureStream 测试信号');
        }

        stopTestSignal();
        testSignalCanvas = canvas;
        const startedAt = performance.now();
        let frame = 0;
        const render = () => {
          drawTestSignal(ctx, width, height, startedAt, frame);
          frame += 1;
          testSignalAnimationId = requestAnimationFrame(render);
        };
        render();

        const stream = canvas.captureStream(fps);
        const videoTrack = stream.getVideoTracks()[0];
        if (videoTrack) videoTrack.contentHint = 'motion';
        return stream;
      }

      async function createPublishStream() {
        if ($('publishSource').value === 'testsrc') {
          log('Publish source: 测试信号 640x480@25fps');
          return createTestSignalStream();
        }
        log('Publish source: 摄像头 640x480@25fps');
        return navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, frameRate: 25 },
          audio: false,
        });
      }

    function publishVideoSender() {
      if (publishVideoSenderRef) return publishVideoSenderRef;
      const tr = publishPc?.getTransceivers().find(
        (t) => t.sender && (t.direction === 'sendonly' || t.currentDirection === 'sendonly')
      );
      return tr?.sender ?? publishPc?.getSenders().find((s) => s.track?.kind === 'video') ?? null;
    }

    // Chrome requires getParameters() immediately before every setParameters() call.
    function primePublishSenderParameters() {
      const sender = publishVideoSender();
      if (!sender) return;
      try {
        sender.getParameters();
      } catch (_) { /* not negotiated yet */ }
    }

    async function trySetParametersKeyFrame(sender) {
      const params = sender.getParameters();
      if (!params.encodings?.length) return false;
      await sender.setParameters(params, {
        encodingOptions: params.encodings.map(() => ({ keyFrame: true })),
      });
      return true;
    }

    function enqueueKeyframeRequest(label) {
      keyframeRequestChain = keyframeRequestChain
        .then(() => requestPublishKeyframe(label))
        .catch((e) => log(label + ': 关键帧队列错误 ' + e));
      return keyframeRequestChain;
    }

    async function requestPublishKeyframe(label) {
      if (!publishPc) {
        log(label + ': 无推流连接');
        return false;
      }
      const serverTriggered = label.includes('need-keyframe') || label.includes('need_keyframe');
      if (keyframeMethod === 'none' && !serverTriggered) return false;
      if (keyframeMethod === 'none' && serverTriggered) {
        log(label + ': 重新尝试关键帧请求方式');
        keyframeMethod = null;
      }
      if (publishPc.connectionState !== 'connected') {
        return false;
      }
      const sender = publishVideoSender();
      if (!sender) {
        log(label + ': 无视频 sender');
        return false;
      }
      const videoTrack = publishVideoTrackRef ?? sender.track;
      if (!videoTrack || videoTrack.readyState !== 'live') {
        log(label + ': 视频 track 不可用');
        return false;
      }

      const tryGenerateKeyFrame = async () => {
        if (typeof sender.generateKeyFrame !== 'function') return false;
        await sender.generateKeyFrame();
        return true;
      };

      const tryReplaceTrack = async () => {
        log(label + ': 警告 — replaceTrack 会重置 RTP 时间戳，仅作兜底');
        await sender.replaceTrack(null);
        await new Promise((r) => setTimeout(r, 100));
        await sender.replaceTrack(videoTrack);
        return true;
      };

      const allMethods = [
        ['generateKeyFrame', tryGenerateKeyFrame],
        ['setParameters', () => trySetParametersKeyFrame(sender)],
      ];
      if (serverTriggered) {
        allMethods.push(['replaceTrack', tryReplaceTrack]);
      }

      const run = async (name, fn) => {
        if (await fn()) return true;
        throw new Error('returned false');
      };

      const order = keyframeMethod
        ? [
            ...allMethods.filter(([n]) => n === keyframeMethod),
            ...allMethods.filter(([n]) => n !== keyframeMethod),
          ]
        : allMethods;

      for (const [name, fn] of order) {
        try {
          await run(name, fn);
          if (keyframeMethod !== name) {
            keyframeMethod = name;
            log(label + ': 关键帧请求方式 → ' + name);
          }
          return true;
        } catch (e) {
          if (keyframeMethod === name) {
            log(label + ': ' + name + ' 失败 ' + e + '，尝试其他方式');
            keyframeMethod = null;
          } else if (!keyframeMethod) {
            log(label + ': ' + name + ' 不可用 ' + e);
          }
        }
      }

      if (!keyframeMethod) {
        log(label + ': 无法请求关键帧，依赖编码器默认 GOP');
        keyframeMethod = 'none';
      }
      return false;
    }

    function startPublishKeyframeInterval() {
      stopPublishKeyframeInterval();
      enqueueKeyframeRequest('Publish-connected');
      keyframeTimer = setInterval(() => {
        if (keyframeMethod === 'generateKeyFrame' || keyframeMethod === 'setParameters') {
          enqueueKeyframeRequest('Publish-interval');
        }
      }, 1000);
    }

    function stopPublishKeyframeInterval() {
      if (keyframeTimer) {
        clearInterval(keyframeTimer);
        keyframeTimer = null;
      }
    }

    function resetPublishState(reason, notifyServer = false) {
      const streamId = $('streamId').value.trim();
      stopPublishKeyframeInterval();
      keyframeMethod = null;
      publishVideoSenderRef = null;
      publishVideoTrackRef = null;
      keyframeRequestChain = Promise.resolve();
      if (negotiatingPc === publishPc) negotiatingPc = null;
      if (activePc === publishPc) activePc = null;
      if (publishPc) {
        try { publishPc.close(); } catch (_) {}
        publishPc = null;
      }
        stopTestSignal();
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }
      $('localVideo').srcObject = null;
      $('btnPublish').disabled = !(ws && ws.readyState === WebSocket.OPEN);
      $('btnStopPublish').disabled = true;
      if (notifyServer && streamId) wsSend({ type: 'stop_publish', stream_id: streamId });
      if (reason) log(reason);
    }

    function isPublishFailure(message) {
      return /publish rejected|publish failed|推流/i.test(message || '')
        || negotiatingPc === publishPc;
    }

    function isPlayFailure(message) {
      return /play rejected|play failed|not publishing|Stream .*not found|播放/i.test(message || '')
        || negotiatingPc === playPc;
    }

    function clearRemoteVideo() {
      const video = $('remoteVideo');
      const stream = video.srcObject;
      if (stream && typeof stream.getTracks === 'function') {
        stream.getTracks().forEach((track) => {
          try { track.stop(); } catch (_) {}
          try { stream.removeTrack(track); } catch (_) {}
        });
      }
      try { video.pause(); } catch (_) {}
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    }

    function resetPlayState(reason, notifyServer = false) {
      const streamId = $('streamId').value.trim();
      playGeneration += 1;
      pendingServerIce.length = 0;
      if (negotiatingPc === playPc) negotiatingPc = null;
      if (activePc === playPc) activePc = null;
      if (notifyServer && streamId) wsSend({ type: 'stop_play', stream_id: streamId });
      if (playPc) {
        try { playPc.ontrack = null; } catch (_) {}
        try { playPc.close(); } catch (_) {}
        playPc = null;
      }
      clearRemoteVideo();
      $('btnPlay').disabled = !(ws && ws.readyState === WebSocket.OPEN);
      $('btnStopPlay').disabled = true;
      if (reason) log(reason);
    }

    function resetDisconnectedState(reason) {
      const hadPublish = !!publishPc || !!localStream;
      const hadPlay = !!playPc;
      resetPublishState(hadPublish ? reason + '，推流状态已清理' : null, false);
      resetPlayState(hadPlay ? reason + '，播放状态已清理' : null, false);
      pendingServerIce.length = 0;
      negotiatingPc = null;
      activePc = null;
      $('btnConnect').disabled = false;
      $('btnDisconnect').disabled = true;
      $('btnPublish').disabled = true;
      $('btnStopPublish').disabled = true;
      $('btnPlay').disabled = true;
      $('btnStopPlay').disabled = true;
    }

    function wsSend(obj) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('WebSocket 未连接');
        return;
      }
      ws.send(JSON.stringify(obj));
    }

    function h264CodecPreferences() {
      const caps = RTCRtpSender.getCapabilities('video');
      if (!caps) return [];
      const h264 = caps.codecs.filter((c) => c.mimeType.toLowerCase() === 'video/h264');
      const aux = caps.codecs.filter((c) => {
        const m = c.mimeType.toLowerCase();
        return m === 'video/rtx' || m === 'video/red' || m === 'video/ulpfec' || m === 'video/flexfec-03';
      });
      return [...h264, ...aux];
    }

    function h265CodecPreferences() {
      const caps = RTCRtpSender.getCapabilities('video');
      if (!caps) return [];
      const h265 = caps.codecs.filter((c) => {
        const m = c.mimeType.toLowerCase();
        return m === 'video/h265' || m === 'video/hevc';
      });
      const aux = caps.codecs.filter((c) => {
        const m = c.mimeType.toLowerCase();
        return m === 'video/rtx' || m === 'video/red' || m === 'video/ulpfec' || m === 'video/flexfec-03';
      });
      return [...h265, ...aux];
    }

    function selectedPublishCodecPreferences() {
      const codec = $('publishCodec').value;
      if (codec === 'h265') {
        return { codec, label: 'H265/HEVC', prefs: h265CodecPreferences() };
      }
      return { codec, label: 'H264', prefs: h264CodecPreferences() };
    }

    let pendingServerIce = [];

    async function addIceToReadyPcs(ice) {
      const pcs = [playPc, publishPc].filter((pc) => pc?.remoteDescription);
      if (!pcs.length) return false;
      for (const pc of pcs) {
        try {
          await pc.addIceCandidate(ice);
          return true;
        } catch (_) { /* ufrag/mline mismatch */ }
      }
      return false;
    }

    async function flushPendingServerIce() {
      const rest = [];
      for (const ice of pendingServerIce) {
        if (!(await addIceToReadyPcs(ice))) rest.push(ice);
      }
      pendingServerIce.length = 0;
      pendingServerIce.push(...rest);
    }

    async function addServerIceCandidate(msg) {
      const ice = {
        candidate: msg.candidate,
        sdpMid: msg.sdp_mid,
        sdpMLineIndex: msg.sdp_mline_index,
      };
      const pcs = [playPc, publishPc].filter(Boolean);
      if (!pcs.length) return;
      const ready = pcs.some((pc) => pc.remoteDescription);
      if (!ready) {
        pendingServerIce.push(ice);
        return;
      }
      if (!(await addIceToReadyPcs(ice))) {
        pendingServerIce.push(ice);
      }
    }

    function wireIce(pc, role) {
      pc.onicecandidate = (ev) => {
        if (!ev.candidate) return;
        wsSend({
          type: 'ice',
          candidate: ev.candidate.candidate,
          sdp_mid: ev.candidate.sdpMid,
          sdp_mline_index: ev.candidate.sdpMLineIndex,
        });
      };
      pc.onconnectionstatechange = () => log(`${role} PC state: ${pc.connectionState}`);
      pc.oniceconnectionstatechange = () => log(`${role} ICE state: ${pc.iceConnectionState}`);
    }

    $('btnConnect').onclick = () => {
      const url = $('wsUrl').value.trim();
      const socket = new WebSocket(url);
      ws = socket;
      socket.onopen = () => {
        if (ws !== socket) return;
        log('信令已连接: ' + url);
        $('btnConnect').disabled = true;
        $('btnDisconnect').disabled = false;
        $('btnPublish').disabled = false;
        $('btnPlay').disabled = false;
      };
      socket.onclose = () => {
        if (ws !== socket) return;
        ws = null;
        log('信令已断开');
        resetDisconnectedState('信令连接已断开');
      };
      socket.onerror = () => {
        if (ws !== socket) return;
        log('WebSocket 错误');
      };
      socket.onmessage = async (ev) => {
        if (ws !== socket) return;
        let msg;
        try { msg = JSON.parse(ev.data); } catch { log('无效 JSON: ' + ev.data); return; }
        if (msg.type === 'answer') {
          const pc = negotiatingPc;
          if (!pc) return;
          try {
            await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
            negotiatingPc = null;
            log('收到 answer');
            await flushPendingServerIce();
          } catch (e) {
            if (pc === publishPc) {
              resetPublishState('推流失败: 设置远端 answer 失败 ' + e);
            } else {
              resetPlayState('播放失败: 设置远端 answer 失败 ' + e);
            }
          }
        } else if (msg.type === 'ice') {
          await addServerIceCandidate(msg);
        } else if (msg.type === 'need_keyframe') {
          enqueueKeyframeRequest('Server-need-keyframe');
        } else if (msg.type === 'error') {
          log('服务器错误: ' + msg.message);
          if (isPublishFailure(msg.message)) {
            resetPublishState('推流失败: ' + msg.message);
          } else if (isPlayFailure(msg.message)) {
            resetPlayState('播放失败: ' + msg.message);
          }
        }
      };
    };

    $('btnDisconnect').onclick = () => {
      if (ws) {
        ws.close();
      } else {
        resetDisconnectedState('信令连接已断开');
      }
    };

    $('btnPublish').onclick = async () => {
      const streamId = $('streamId').value.trim();
      if (!streamId) return log('请填写 stream_id');
      try {
          localStream = await createPublishStream();
        $('localVideo').srcObject = localStream;
        publishPc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        wireIce(publishPc, 'publish');
        publishPc.addEventListener('connectionstatechange', () => {
          if (publishPc?.connectionState === 'connected') {
            primePublishSenderParameters();
            startPublishKeyframeInterval();
          }
          if (publishPc?.connectionState === 'closed' || publishPc?.connectionState === 'failed') {
            stopPublishKeyframeInterval();
          }
        });
        const videoTrack = localStream.getVideoTracks()[0];
        publishVideoTrackRef = videoTrack;
        const pubTr = publishPc.addTransceiver(videoTrack, { direction: 'sendonly' });
        publishVideoSenderRef = pubTr.sender;
        const { codec, label, prefs } = selectedPublishCodecPreferences();
        if (prefs.length) {
          pubTr.setCodecPreferences(prefs);
          const primaryCount = prefs.filter((c) => {
            const m = c.mimeType.toLowerCase();
            return codec === 'h265'
              ? (m === 'video/h265' || m === 'video/hevc')
              : m === 'video/h264';
          }).length;
          log('Publish: prefer ' + label + ' (' + primaryCount + ' codecs)');
        } else {
          resetPublishState('推流失败: 当前浏览器不支持 ' + label);
          return;
        }
        const offer = await publishPc.createOffer({
          offerToReceiveAudio: false,
          offerToReceiveVideo: false,
        });
        await publishPc.setLocalDescription(offer);
        primePublishSenderParameters();
        negotiatingPc = publishPc;
        activePc = publishPc;
        wsSend({ type: 'publish', stream_id: streamId, sdp: offer.sdp });
        log('已发送 publish offer, stream_id=' + streamId);
        $('btnPublish').disabled = true;
        $('btnStopPublish').disabled = false;
      } catch (e) {
        resetPublishState('推流失败: ' + e);
      }
    };

    $('btnStopPublish').onclick = () => {
      const streamId = $('streamId').value.trim();
      resetPublishState('推流已停止', !!streamId);
      if (playPc) resetPlayState('推流已停止，同步停止播放', false);
    };

    $('btnPlay').onclick = async () => {
      const streamId = $('streamId').value.trim();
      if (!streamId) return log('请填写 stream_id');
      try {
        resetPlayState(null, false);
        const generation = playGeneration;
        playPc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        const thisPc = playPc;
        wireIce(playPc, 'play');
        const playTr = playPc.addTransceiver('video', { direction: 'recvonly' });
        const playCaps = RTCRtpReceiver.getCapabilities('video');
        if (playCaps?.codecs?.length) {
          log('Play: receiver codecs=' + playCaps.codecs.map((c) => c.mimeType).join(','));
          
          const hevcCodecs = playCaps.codecs.filter((c) => c.mimeType.toLowerCase().includes('hevc') || c.mimeType.toLowerCase().includes('h265'));
          const h264Codecs = playCaps.codecs.filter((c) => c.mimeType.toLowerCase().includes('h264'));
          
          if (hevcCodecs.length > 0) {
            log('Play: HEVC codecs available, setting codec preference');
            playTr.setCodecPreferences([...hevcCodecs, ...h264Codecs]);
          } else if (h264Codecs.length > 0) {
            log('Play: No HEVC codecs available, using H264');
            playTr.setCodecPreferences(h264Codecs);
          }
        }
        const remoteStream = new MediaStream();
        $('remoteVideo').srcObject = remoteStream;
        playPc.ontrack = (ev) => {
          if (generation !== playGeneration || thisPc !== playPc) {
            log('忽略旧播放连接的远端 track: ' + ev.track.kind);
            try { ev.track.stop(); } catch (_) {}
            return;
          }
          log('收到远端 track: ' + ev.track.kind + ' id=' + ev.track.id + ' readyState=' + ev.track.readyState);
          log('track codec: ' + (ev.track.getSettings ? JSON.stringify(ev.track.getSettings()) : 'no getSettings'));
          remoteStream.addTrack(ev.track);
          ev.track.onended = () => log('track ended: ' + ev.track.kind);
          ev.track.onmute = () => log('track muted: ' + ev.track.kind);
          ev.track.onunmute = () => {
            log('track unmuted: ' + ev.track.kind);
            $('remoteVideo').play().catch((e) => log('video.play(): ' + e));
          };
          $('remoteVideo').play().catch((e) => log('video.play(): ' + e));
        };
        
        $('remoteVideo').onloadedmetadata = () => {
          log('视频元数据加载完成: width=' + $('remoteVideo').videoWidth + ' height=' + $('remoteVideo').videoHeight);
        };
        
        $('remoteVideo').onplaying = () => {
          log('视频开始播放');
        };
        
        $('remoteVideo').onwaiting = () => {
          log('视频等待中...');
        };
        
        $('remoteVideo').onstalled = () => {
          log('视频流停滞');
        };
        
        $('remoteVideo').onerror = (e) => {
          log('视频错误: ' + e.message);
        };
        const offer = await playPc.createOffer();
        await playPc.setLocalDescription(offer);
        negotiatingPc = playPc;
        activePc = playPc;
        wsSend({ type: 'play', stream_id: streamId, sdp: offer.sdp });
        log('已发送 play offer, stream_id=' + streamId);
        $('btnPlay').disabled = true;
        $('btnStopPlay').disabled = false;
      } catch (e) {
        resetPlayState('播放失败: ' + e);
      }
    };

    $('btnStopPlay').onclick = () => {
      const streamId = $('streamId').value.trim();
      resetPlayState('播放已停止', !!streamId);
    };
  </script>
</body>
</html>
